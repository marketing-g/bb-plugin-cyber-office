<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Result card preview</title><link rel="stylesheet" href="./dist/preview-itog.css">
<style>
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
body:has(.pv[data-theme=dark]){background:#0e1120;color:#eef1f8}
body:has(.pv[data-theme=light]){background:#f6f2ea;color:#1f2333}
.pv{margin:0 auto;padding:24px 16px 40px}
.pv-head{margin-bottom:18px}.pv-head h1{margin:0 0 4px;font-size:24px}.pv-head p{margin:0;opacity:.7}
.pv-grid{display:grid;gap:18px}
.pv-case{margin:0}.pv-case figcaption{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.55;margin-bottom:2px}
.kmi-mock-original{margin:10px 0;max-width:760px;padding:10px 12px;border-radius:6px;font:13px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;background:#00000033;border:1px solid #80808055}
.kmi-mock-original span{opacity:.5}
.pv-composer{display:grid;gap:6px;margin-top:24px;max-width:760px}.pv-composer span{font-size:12px;font-weight:700;opacity:.6}
.pv-composer textarea{font:inherit;padding:10px;border-radius:8px;border:2px solid #80808066;background:transparent;color:inherit}
</style></head><body><div id="root"></div><script src="./dist/preview-itog.js"></script></body></html>
